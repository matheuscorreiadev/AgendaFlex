<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgendaFlex - SaaS de Agendamento</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Estilos Customizados -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen pb-12">

  <!-- TOP BAR / ROLE SWITCHER -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-500/30">
          <i data-lucide="calendar"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white tracking-tight">Agenda<span class="text-indigo-400">Flex</span></h1>
          <p class="text-xs text-slate-400">Plataforma de Agendamentos SaaS</p>
        </div>
      </div>

      <!-- Toggle entre Admin e Visão do Cliente -->
      <div class="flex items-center bg-slate-900/80 p-1.5 rounded-xl border border-slate-700">
        <span class="text-xs font-semibold px-2 text-slate-400">Modo:</span>
        <button id="btn-mode-admin" onclick="switchView('admin')" class="flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-medium transition bg-indigo-600 text-white shadow-md">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span>Painel Admin</span>
        </button>
        <button id="btn-mode-client" onclick="switchView('client')" class="flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white">
          <i data-lucide="user-check" class="w-4 h-4"></i>
          <span>Visão do Cliente</span>
        </button>
      </div>
    </div>
  </header>
